<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating - Lagiote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 3rem 4rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      font-weight: bold;
    }

    h1 {
      color: #1f2937;
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      font-size: 1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .note {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">L</div>
    <h1>Redirecting to Auth0</h1>
    <p>Please wait while we redirect you to the login page...</p>
    <div class="spinner"></div>
    <p class="note">
      You will be redirected to Auth0's secure login page
    </p>
  </div>

  <script>
    // This page is only used as a placeholder
    // The actual Auth0 login page will be loaded by Electron's main process
    console.log('[Auth Window] Placeholder page loaded');
    console.log('[Auth Window] Waiting for Auth0 redirect from main process...');
  </script>
</body>

</html>
