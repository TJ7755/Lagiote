name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --global npm@12.2.1 && npm ci

      - name: Check runtime structure
        run: npm run check:structure

      - name: Run legacy tests
        run: npm test

      - name: Run vitest suite
        run: npx vitest run

      - name: Build web app
        run: npm run build

      - name: Smoke test web build
        run: node tests/smoke.build.mjs

      - name: Build/make application
        run: npm run make -- --platform win32

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LagioteRevise-Windows
          path: out/make/**/*
          retention-days: 30
