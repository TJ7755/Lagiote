name: Release

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for proper release notes

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --global npm@12.2.1 && npm ci

      - name: Get version from package.json
        id: package_version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Building version: $version"

      - name: Build and Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run make -- --publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LagioteRevise-v${{ steps.package_version.outputs.version }}-Windows
          path: out/make/**/*
          retention-days: 30
